name: Build and deploy site

on:
  schedule:
    # GitHub cron is UTC only. EST = UTC-5 (EDT, UTC-4, ended Nov 1 2026).
    - cron: "0 11 * * 5"    # Friday 6:00 AM EST
    - cron: "45 4 * * 1"    # Sunday 11:45 PM EST = Monday 04:45 UTC
    - cron: "0 11 * * 2"    # Tuesday 6:00 AM EST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate site
        run: dotnet run --project Generator -c Release -- site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
